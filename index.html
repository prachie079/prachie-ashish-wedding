*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#171512;font-family:Georgia,'Times New Roman',serif}body{display:flex;align-items:center;justify-content:center;overflow:hidden}.phone{position:relative;width:min(100vw,56.25vh);height:min(100dvh,177.78vw);aspect-ratio:9/16;overflow:hidden;background:#eee;box-shadow:0 15px 70px #0008}.slide{position:absolute;inset:0;background-size:100% 100%;background-position:center;opacity:0;transition:opacity .45s ease;pointer-events:none}.slide.active{opacity:1;pointer-events:auto}.tap{position:absolute;left:24%;right:24%;bottom:13%;height:11%;border:0;background:transparent;cursor:pointer}.nav{position:absolute;bottom:2.5%;left:4%;right:4%;height:9%;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.nav button,.top button{pointer-events:auto;border:1px solid #fff8;background:#fff7;color:#76533d;border-radius:50%;width:42px;height:42px;font-size:22px;backdrop-filter:blur(5px);cursor:pointer}.top{position:absolute;top:2%;right:3%;display:flex;gap:8px}.top button{width:34px;height:34px;font-size:15px}.rsvp-launch{position:absolute;bottom:3%;left:25%;right:25%;height:7%;border:0;background:transparent;cursor:pointer}.panel{position:absolute;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}.panel.show{display:flex}.form{width:100%;max-height:94%;overflow:auto;background:#fffaf1;border-radius:22px 22px 0 0;padding:24px 20px 18px;color:#6e3c50}.form h2{text-align:center;font-style:italic;font-size:27px;margin:0 0 4px}.form p{text-align:center;font-size:12px;margin:0 0 18px;color:#856d65}.form label{display:block;font:10px Arial,sans-serif;letter-spacing:1.5px;margin:12px 0 5px;color:#927a68}.form input,.form textarea{width:100%;border:1px solid #e8d8c7;border-radius:10px;padding:12px;background:#fffdf8;font:14px Arial}.form textarea{min-height:65px}.choices{display:flex;gap:5px}.choices button{flex:1;border:1px solid #d9bba9;background:#fff7ef;color:#8d5967;border-radius:18px;padding:9px 3px;font-size:11px}.choices button.selected{background:#a92c57;color:#fff}.submit{width:100%;border:0;background:#a92c57;color:white;border-radius:22px;padding:13px;margin-top:15px;letter-spacing:1px}.close{position:absolute;right:15px;top:12px;border:0;background:none;font-size:23px;color:#9a6b6b}.petals{position:absolute;inset:0;pointer-events:none;z-index:20;display:none}.petals.go{display:block}.petal{position:absolute;top:-10%;width:12px;height:18px;background:#e9a5b7;border-radius:100% 0 100% 0;animation:fall 3.5s linear forwards}@keyframes fall{to{transform:translateY(120vh) rotate(700deg);opacity:.1}}.hint{position:absolute;bottom:1%;left:0;right:0;text-align:center;color:#fff9;font:9px Arial;letter-spacing:1px;pointer-events:none}.toast{position:absolute;left:10%;right:10%;top:45%;padding:16px;border-radius:12px;background:#fffaf0;color:#8b3156;text-align:center;display:none;z-index:30}

<div class="panel" id="panel"><form class="form" id="rsvp"><button type="button" class="close" id="close">×</button><h2>Kindly Respond</h2><p>Please reply by 15 December 2026</p><label>YOUR NAME</label><input name="name" required placeholder="Full name"><label>MOBILE</label><input name="mobile" placeholder="+91" required><label>WILL YOU JOIN US?</label><div class="choices" data-group="attendance"><button type="button" class="selected">Joyfully attending</button><button type="button">Regretfully no</button><button type="button">With regrets</button></div><label>NUMBER OF GUESTS</label><input name="guests" type="number" min="1" max="20" value="2"><label>DATES YOU'LL BE THERE</label><div class="choices" data-group="dates"><button type="button" class="selected">24th Jan</button><button type="button" class="selected">25th Jan</button></div><label>BLESSINGS FOR THE COUPLE</label><textarea name="note" placeholder="A note for Prachie & Ashish"></textarea><button class="submit" type="submit">SEND RSVP</button><p id="rsvpStatus" style="margin-top:10px"></p></form></div>

</main><script>
const slides=[...document.querySelectorAll('.slide')],song=document.getElementById('song');let page=0,started=false,attendance='Joyfully attending',dates=['24th Jan','25th Jan'];const show=n=>{page=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('active',i===page));document.getElementById('hint').textContent=page===0?'TAP THE CURTAIN TO OPEN':page===1?'TAP THE COUPLE TO BEGIN':page===10?'REPLAY INVITATION':'TAP TO TURN THE PAGE';document.getElementById('openRsvp').style.display=page>=9?'block':'none'};async function start(){if(!started){started=true;try{await song.play()}catch(e){document.getElementById('music').textContent='♫'}}}function advance(){if(page===0){show(1);start()}else if(page===10){show(0)}else show(page+1)}document.getElementById('tap').onclick=advance;document.getElementById('next').onclick=()=>{if(page===0)start();show(page+1)};document.getElementById('prev').onclick=()=>show(page-1);document.getElementById('music').onclick=async()=>{if(song.paused){await start();song.play()}else song.pause()};document.getElementById('replay').onclick=()=>{show(0);song.currentTime=0;started=false;advance();start()};document.getElementById('openRsvp').onclick=()=>document.getElementById('panel').classList.add('show');document.getElementById('close').onclick=()=>document.getElementById('panel').classList.remove('show');document.querySelectorAll('.choices').forEach(group=>group.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(group.dataset.group==='attendance'){group.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');attendance=b.textContent}else{b.classList.toggle('selected');dates=[...group.querySelectorAll('.selected')].map(x=>x.textContent)}}));document.getElementById('rsvp').onsubmit=e=>{e.preventDefault();document.getElementById('rsvpStatus').textContent='Your RSVP form is ready. Please connect the Google Sheet endpoint to receive responses.'};function exitPetals(){const p=document.getElementById('petals');p.classList.add('go');for(let i=0;i<35;i++){let el=document.createElement('i');el.className='petal';el.style.left=Math.random()*100+'%';el.style.animationDelay=Math.random()*1.8+'s';el.style.transform='rotate('+Math.random()*180+'deg)';p.appendChild(el)}}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')exitPetals()});window.addEventListener('pagehide',exitPetals);show(0);
</script></body></html>
